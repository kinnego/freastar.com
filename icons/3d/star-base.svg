  <!-- Highlight overlay -->
  <path d="M60 10
    L69 40 L100 40 L76 58 L85 88
    L60 72 L35 88 L44 58 L20 40
    L51 40 Z"
    fill="url(#starShadow)" stroke="none"/>
  <!-- Eyes -->
  <ellipse cx="50" cy="52" rx="5" ry="6" fill="white"/>
  <ellipse cx="70" cy="52" rx="5" ry="6" fill="white"/>
  <ellipse cx="51" cy="53" rx="2.5" ry="3" fill="#174EA6"/>
  <ellipse cx="71" cy="53" rx="2.5" ry="3" fill="#174EA6"/>
  <!-- Smile -->
  <path d="M50 64 Q60 72 70 64" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
