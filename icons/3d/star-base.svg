<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="starGrad" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#5B9BF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1240A0"/>
    </radialGradient>
    <radialGradient id="starShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#174EA6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A2560" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <!-- Star body: 5-point rounded star -->
  <path d="M60 10
    L69 40 L100 40 L76 58 L85 88
    L60 72 L35 88 L44 58 L20 40
    L51 40 Z"
